name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-build:
    name: Lint, Type Check & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # ⚠️ MIDLERTIDIGT (Trin 5): format:check er gjort IKKE-blokerende. ~860
      # pre-eksisterende kildefiler matcher ikke .prettierrc (repoet er aldrig
      # blevet prettier-normaliseret). Fuld `prettier --write` + genaktivering
      # af dette trin som blokerende (fjern `|| true`) bundtes med Trin 5 — se
      # IDEAS.md §14. Outputtet er stadig synligt i loggen.
      - name: Check formatting (ikke-blokerende, midlertidigt — se IDEAS.md/Trin 5)
        run: npm run format:check || true

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npm run type-check

      - name: Check offers→customers FK disambiguation
        run: npm run check:offers-embeds

      - name: Build application
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
